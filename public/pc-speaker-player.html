<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>پخش سلطنتی صدای سیستم روی گوشی | CellPhoneManager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #0a0b0f;
      color: #fef9c3;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(212, 175, 55, 0.18), transparent 60%),
        radial-gradient(circle at 80% 90%, rgba(30, 31, 40, 0.5), transparent 70%);
    }
    .card {
      background: rgba(18, 19, 25, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 28px;
      padding: 30px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 20px rgba(212, 175, 55, 0.08);
      text-align: center;
      position: relative;
    }
    .header {
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(212, 175, 55, 0.15);
      color: #fde047;
      border: 1px solid rgba(212, 175, 55, 0.35);
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }
    .badge.disconnected {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border-color: rgba(244, 63, 94, 0.3);
    }
    .badge.buffering {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
    }
    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    h1 {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 60%, #eab308 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 12px;
      color: #a8a29e;
    }
    /* Visualizer Canvas */
    .visualizer-container {
      width: 100%;
      height: 90px;
      background: rgba(10, 11, 15, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 20px;
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    canvas {
      width: 100%;
      height: 100%;
    }
    /* Big Royal Play/Pause Button */
    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #facc15, #ca8a04, #854d0e);
      border: none;
      color: #0c0d11;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      margin: 0 auto 20px;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4), 0 0 15px rgba(212, 175, 55, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .play-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
    }
    .play-btn.paused {
      background: linear-gradient(135deg, #2a2b36, #1a1b22);
      color: #e2e8f0;
      box-shadow: none;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    /* Controls Area */
    .volume-box {
      background: rgba(14, 15, 20, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .volume-box span {
      font-size: 13px;
      font-weight: 700;
      color: #fef08a;
      min-width: 42px;
    }
    input[type=range] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: #242633;
      border-radius: 9999px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #facc15;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(234, 179, 8, 0.6);
    }
    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #78716c;
      padding: 0 4px;
    }
    .stats-row span strong {
      color: #d4af37;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div id="statusBadge" class="badge">
        <span class="indicator"></span>
        <span id="statusText">در حال آماده‌سازی...</span>
      </div>
      <h1>بلندگوی کامپیوتر روی گوشی</h1>
      <p class="subtitle">استریم زنده و بدون تاخیر از طریق کابل USB یا Wi-Fi</p>
    </div>

    <!-- Visualizer Canvas -->
    <div class="visualizer-container">
      <canvas id="visualizerCanvas"></canvas>
    </div>

    <!-- Play/Stop Toggle -->
    <button id="togglePlayBtn" class="play-btn" title="پخش / توقف">
      ▶
    </button>

    <!-- Volume Slider -->
    <div class="volume-box">
      <span id="volLabel">100%</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="100">
      <span style="font-size: 16px;">🔊</span>
    </div>

    <!-- Telemetry Stats -->
    <div class="stats-row">
      <span>سرعت: <strong id="latencyLabel">کم‌تاخیر (Ultra-Low)</strong></span>
      <span>کیفیت: <strong>Royal HD Live</strong></span>
    </div>
  </div>

  <audio id="audioElement" preload="none" crossorigin="anonymous"></audio>

  <script>
    const audio = document.getElementById('audioElement');
    const toggleBtn = document.getElementById('togglePlayBtn');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const volumeSlider = document.getElementById('volumeSlider');
    const volLabel = document.getElementById('volLabel');
    const canvas = document.getElementById('visualizerCanvas');
    const canvasCtx = canvas.getContext('2d');

    let audioCtx = null;
    let analyser = null;
    let isPlaying = false;
    let wakeLock = null;

    // Stream URL
    const streamUrl = '/api/pc-speaker/stream.mp3?t=' + Date.now();

    function setStatus(state, text) {
      statusBadge.className = 'badge ' + state;
      statusText.textContent = text;
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function initAudioContext() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;

        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (e) {
        console.warn('WebAudio setup:', e);
      }
    }

    function renderVisualizer() {
      if (!canvas || !canvasCtx) return;
      requestAnimationFrame(renderVisualizer);

      const width = canvas.width = canvas.parentElement.clientWidth;
      const height = canvas.height = canvas.parentElement.clientHeight;

      canvasCtx.clearRect(0, 0, width, height);

      if (!analyser || !isPlaying) {
        // Idle ambient golden glow line
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, height / 2);
        canvasCtx.lineTo(width, height / 2);
        canvasCtx.strokeStyle = 'rgba(212, 175, 55, 0.2)';
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();
        return;
      }

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      const barWidth = (width / bufferLength) * 1.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * height * 0.85;

        // Royal gold metallic gradient
        const gradient = canvasCtx.createLinearGradient(0, height, 0, height - barHeight);
        gradient.addColorStop(0, '#854d0e');
        gradient.addColorStop(0.5, '#eab308');
        gradient.addColorStop(1, '#fef08a');

        canvasCtx.fillStyle = gradient;
        canvasCtx.fillRect(x, height - barHeight, barWidth - 2, barHeight);

        x += barWidth;
      }
    }

    async function startPlayback() {
      try {
        initAudioContext();
        if (audioCtx && audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        setStatus('buffering', 'در حال اتصال...');
        audio.src = streamUrl;
        audio.volume = volumeSlider.value / 100;
        await audio.play();

        isPlaying = true;
        toggleBtn.textContent = '⏸';
        toggleBtn.classList.remove('paused');
        setStatus('', 'در حال پخش صدای سیستم');
        requestWakeLock();
      } catch (err) {
        console.error('Play error:', err);
        setStatus('disconnected', 'خطا در اتصال یا عدم استریم');
        isPlaying = false;
        toggleBtn.textContent = '▶';
        toggleBtn.classList.add('paused');
      }
    }

    function stopPlayback() {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      isPlaying = false;
      toggleBtn.textContent = '▶';
      toggleBtn.classList.add('paused');
      setStatus('disconnected', 'پخش متوقف شد');
    }

    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        stopPlayback();
      } else {
        startPlayback();
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      volLabel.textContent = val + '%';
      audio.volume = val / 100;
    });

    audio.addEventListener('waiting', () => {
      setStatus('buffering', 'در حال بافرینگ...');
    });

    audio.addEventListener('playing', () => {
      setStatus('', 'در حال پخش صدای سیستم');
    });

    audio.addEventListener('error', () => {
      setStatus('disconnected', 'قطع ارتباط با سرور');
      isPlaying = false;
      toggleBtn.textContent = '▶';
      toggleBtn.classList.add('paused');
    });

    // Start visualizer loop
    renderVisualizer();

    // Auto attempt play on user interaction
    document.body.addEventListener('touchstart', () => {
      if (!isPlaying && !audio.src) {
        startPlayback();
      }
    }, { once: true });
  </script>
</body>
</html>
